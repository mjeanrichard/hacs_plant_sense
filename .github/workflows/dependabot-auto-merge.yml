name: "Dependabot auto-merge"

# Enables GitHub auto-merge on Dependabot PRs. The PR is only merged once all
# status checks required by the ruleset on main (Ruff, Tests, Hassfest
# Validation, HACS Validation) have passed; a red build leaves it open.

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: "Enable auto-merge"
    runs-on: "ubuntu-latest"
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: "Enable auto-merge for this PR"
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
