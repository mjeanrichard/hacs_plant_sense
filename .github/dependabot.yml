---
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Dependabot should not update Home Assistant as that should match
      # the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
      # Each pytest-homeassistant-custom-component release pins an exact
      # homeassistant version, so it has to be bumped together with it.
      - dependency-name: "pytest-homeassistant-custom-component"
